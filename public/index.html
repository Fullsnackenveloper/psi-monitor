<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageSpeed Monitor</title>
<meta name="description" content="Scheduled PageSpeed Insights monitoring with score history and alerting.">
<meta name="theme-color" content="#16202C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:      #EDF1F6;
    --card:       #FBFCFD;
    --ink:        #16202C;
    --ink-soft:   #4A5A6B;
    --ink-faint:  #7B8A9A;
    --rule:       #C6D0DC;
    --rule-soft:  #DFE5EC;
    --blue:       #0B5E8A;
    --blue-wash:  #E3EDF4;
    --green:      #1B7A4B;
    --green-bg:   rgba(27,122,75,.09);
    --amber:      #9A6212;
    --red:        #B3261E;
    --red-bg:     rgba(179,38,30,.07);

    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--rule-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule-soft) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    padding: 2rem clamp(1rem, 4vw, 2rem);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  .masthead {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 1rem; flex-wrap: wrap;
    padding-bottom: .9rem; margin-bottom: 1.75rem;
    border-bottom: 1px solid var(--ink);
  }
  .page-title { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  .page-sub { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .masthead-links { display: flex; gap: 1.25rem; font-family: var(--mono); font-size: 12px; }
  .masthead-links a {
    text-decoration: none; color: var(--ink-soft);
    padding-bottom: 2px; border-bottom: 1px solid var(--rule);
    transition: color .15s, border-color .15s;
  }
  .masthead-links a:hover, .masthead-links a:focus-visible { color: var(--blue); border-color: var(--blue); }

  .label {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
  }

  .section-head {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding-bottom: .6rem; border-bottom: 1px solid var(--rule);
    margin-bottom: 1rem;
  }
  .section-head .meta { margin-left: auto; font-size: 12px; color: var(--ink-faint); }

  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--ink);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }

  .chart-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .chart-legend { display: flex; gap: 1rem; }
  .legend-item { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .chart-empty { padding: 2rem; text-align: center; color: var(--ink-faint); font-size: 13px; }

  .toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .btn {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: .55rem 1.1rem; border: 1px solid var(--ink); background: var(--card); color: var(--ink);
    cursor: pointer; display: inline-flex; align-items: center; gap: .45rem;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn:hover:not(:disabled) { background: var(--blue-wash); border-color: var(--blue); color: var(--blue); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 1.5rem; }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--card); padding: .9rem 1.1rem; }
  .stat-label { font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: .35rem; }
  .stat-val { font-family: var(--mono); font-size: 26px; font-weight: 600; }
  .stat-val.danger { color: var(--red); }

  .filters { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .filters input, .filters select {
    font-family: var(--sans); font-size: 13px; padding: .5rem .7rem;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink); outline: none;
  }
  .filters input { flex: 1; min-width: 180px; }
  .filters input:focus, .filters select:focus { border-color: var(--blue); }

  .table-wrap { border: 1px solid var(--rule); background: var(--card); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--paper); }
  th {
    text-align: left; padding: .65rem 1rem;
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint);
    border-bottom: 1px solid var(--rule); cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--ink); }
  td { padding: .65rem 1rem; border-bottom: 1px solid var(--rule-soft); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--blue-wash); }

  .score { font-family: var(--mono); font-weight: 600; }
  .good { color: var(--green); }
  .warn { color: var(--amber); }
  .bad  { color: var(--red); }

  .badge {
    display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 500;
    padding: .2rem .6rem; border-radius: 20px; letter-spacing: .08em; text-transform: uppercase;
  }
  .badge.ok    { background: var(--green-bg); color: var(--green); }
  .badge.alert { background: var(--red-bg);   color: var(--red); }
  .badge.err   { background: var(--rule-soft); color: var(--ink-faint); cursor: help; }
  .badge.pend  { background: var(--rule-soft); color: var(--ink-faint); }

  .site-label { font-weight: 500; }
  .site-host { color: var(--ink-faint); font-size: 12px; }
  .cell-date { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  .sort-arrow { opacity: .3; font-size: 9px; margin-left: 3px; }
  .sort-arrow.active { opacity: 1; color: var(--blue); }
  .empty { padding: 2.5rem; text-align: center; color: var(--ink-faint); font-size: 14px; }

  .spin { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <div class="page-title">PageSpeed Monitor</div>
      <div class="page-sub">Scheduled performance checks with score history and alerting</div>
    </div>
    <nav class="masthead-links">
      <a href="https://github.com/msschermer/psi-monitor" target="_blank" rel="noopener">Source</a>
      <a href="https://msschermer.us">Portfolio</a>
    </nav>
  </header>

  <div class="section-head">
    <h2 class="label">Score trend</h2>
    <span class="meta" id="chart-subtitle">Loading history</span>
  </div>
  <div class="panel">
    <div class="chart-header">
      <div class="chart-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#0B5E8A"></span> Mobile</div>
        <div class="legend-item"><span class="legend-dot" style="background:#1B7A4B"></span> Desktop</div>
        <div class="legend-item"><span class="legend-dot" style="background:#C6D0DC;border:1px dashed #7B8A9A"></span> Threshold</div>
      </div>
    </div>
    <div id="chart-container"></div>
  </div>

  <div class="section-head">
    <h2 class="label">Monitored sites</h2>
    <span class="meta" id="last-refreshed">Loading</span>
  </div>

  <div class="toolbar">
    <div class="filters">
      <input type="text" id="search" placeholder="Filter by site" oninput="applyFilters()">
      <select id="status-filter" onchange="applyFilters()">
        <option value="all">All statuses</option>
        <option value="alert">Alerts only</option>
        <option value="ok">OK only</option>
        <option value="error">Errors only</option>
      </select>
    </div>
    <button class="btn" id="refresh-btn" onclick="loadAll()"><span id="spin-icon">&#8635;</span> Refresh</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Sites</div><div class="stat-val" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Alerts</div><div class="stat-val danger" id="stat-alerts">—</div></div>
    <div class="stat"><div class="stat-label">Avg mobile</div><div class="stat-val" id="stat-mobile">—</div></div>
    <div class="stat"><div class="stat-label">Avg desktop</div><div class="stat-val" id="stat-desktop">—</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('url')">Site <span class="sort-arrow" id="arr-url"></span></th>
          <th onclick="sortBy('mobile')">Mobile <span class="sort-arrow active" id="arr-mobile">▲</span></th>
          <th onclick="sortBy('desktop')">Desktop <span class="sort-arrow" id="arr-desktop"></span></th>
          <th onclick="sortBy('status')">Status <span class="sort-arrow" id="arr-status"></span></th>
          <th>Last checked</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5" class="empty">Loading</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
let ALL = [], filtered = [], THRESHOLD = 70;
let sortKey = 'mobile', sortDir = 1;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderChart(history) {
  const container = document.getElementById('chart-container');
  const subtitle  = document.getElementById('chart-subtitle');

  if (!history || history.length < 2) {
    container.innerHTML = '<div class="chart-empty">The trend line appears once a few scan cycles have completed.</div>';
    subtitle.textContent = history && history.length === 1 ? '1 scan recorded' : 'No scans recorded yet';
    return;
  }

  const fmt = iso => new Date(iso.replace(' ', 'T') + 'Z').toLocaleDateString([], { month: 'short', day: 'numeric' });
  const pts = history.map(h => ({ date: fmt(h.startedAt), avgMobile: h.avgMobile ?? 0, avgDesktop: h.avgDesktop ?? 0 }));

  subtitle.textContent = pts.length + ' scans · ' + pts[0].date + ' to ' + pts[pts.length - 1].date;

  const W = 880, H = 190, PAD = { top: 16, right: 40, bottom: 30, left: 34 };
  const cw = W - PAD.left - PAD.right, ch = H - PAD.top - PAD.bottom;
  const all = pts.flatMap(d => [d.avgMobile, d.avgDesktop]);
  const min = Math.max(0, Math.floor(Math.min(...all, THRESHOLD) / 10) * 10 - 5);
  const max = Math.min(100, Math.ceil(Math.max(...all) / 10) * 10 + 5);
  const sx = i => PAD.left + (i / (pts.length - 1)) * cw;
  const sy = v => PAD.top + ch - ((v - min) / (max - min)) * ch;
  const line = k => pts.map((d, i) => sx(i) + ',' + sy(d[k])).join(' ');

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img" aria-label="Average scores over time">`;
  for (let v = min; v <= max; v += 10) {
    svg += `<line x1="${PAD.left}" y1="${sy(v)}" x2="${W - PAD.right}" y2="${sy(v)}" stroke="#DFE5EC" stroke-width="1"/>`;
    svg += `<text x="${PAD.left - 6}" y="${sy(v) + 4}" font-size="10" fill="#7B8A9A" text-anchor="end" font-family="IBM Plex Mono, monospace">${v}</text>`;
  }
  svg += `<line x1="${PAD.left}" y1="${sy(THRESHOLD)}" x2="${W - PAD.right}" y2="${sy(THRESHOLD)}" stroke="#7B8A9A" stroke-width="1" stroke-dasharray="4,3"/>`;
  svg += `<text x="${W - PAD.right + 4}" y="${sy(THRESHOLD) + 4}" font-size="9" fill="#7B8A9A" font-family="IBM Plex Mono, monospace">${THRESHOLD}</text>`;
  const step = pts.length <= 8 ? 1 : Math.ceil(pts.length / 8);
  pts.forEach((d, i) => {
    if (i % step !== 0 && i !== pts.length - 1) return;
    svg += `<text x="${sx(i)}" y="${H - 4}" font-size="10" fill="#7B8A9A" text-anchor="middle" font-family="IBM Plex Mono, monospace">${d.date}</text>`;
  });
  svg += `<polyline points="${line('avgDesktop')}" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>`;
  svg += `<polyline points="${line('avgMobile')}" fill="none" stroke="#0B5E8A" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((d, i) => {
    svg += `<circle cx="${sx(i)}" cy="${sy(d.avgDesktop)}" r="3" fill="#1B7A4B" stroke="#FBFCFD" stroke-width="1.5"/>`;
    svg += `<circle cx="${sx(i)}" cy="${sy(d.avgMobile)}" r="3" fill="#0B5E8A" stroke="#FBFCFD" stroke-width="1.5"/>`;
    if (i === pts.length - 1) {
      svg += `<text x="${sx(i) + 6}" y="${sy(d.avgDesktop) + 4}" font-size="10" font-weight="600" fill="#1B7A4B" font-family="IBM Plex Mono, monospace">${d.avgDesktop}</text>`;
      svg += `<text x="${sx(i) + 6}" y="${sy(d.avgMobile) + 4}" font-size="10" font-weight="600" fill="#0B5E8A" font-family="IBM Plex Mono, monospace">${d.avgMobile}</text>`;
    }
  });
  svg += `</svg>`;
  container.innerHTML = svg;
}

function scoreClass(s) {
  if (typeof s !== 'number') return '';
  if (s >= THRESHOLD) return 'good';
  if (s >= THRESHOLD - 20) return 'warn';
  return 'bad';
}
function worst(r) {
  return Math.min(typeof r.mobile === 'number' ? r.mobile : 999, typeof r.desktop === 'number' ? r.desktop : 999);
}
function fmtDate(v) {
  if (!v) return '—';
  return new Date(v.replace(' ', 'T') + 'Z').toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function badge(r) {
  if (r.mobileStatus === 'PENDING' && r.desktopStatus === 'PENDING') return '<span class="badge pend">Pending</span>';
  if (r.mobileStatus === 'ERROR' || r.desktopStatus === 'ERROR') {
    return `<span class="badge err" title="${esc(r.mobileError || r.desktopError || 'Unknown error')}">Error</span>`;
  }
  if (r.mobileStatus === 'ALERT' || r.desktopStatus === 'ALERT') return '<span class="badge alert">Alert</span>';
  return '<span class="badge ok">OK</span>';
}
function sortBy(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  document.querySelectorAll('.sort-arrow').forEach(el => { el.textContent = ''; el.classList.remove('active'); });
  const arr = document.getElementById('arr-' + key);
  if (arr) { arr.textContent = sortDir === 1 ? '▲' : '▼'; arr.classList.add('active'); }
  render();
}
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('status-filter').value;
  filtered = ALL.filter(r => {
    if (q && !((r.url + ' ' + (r.label || '')).toLowerCase().includes(q))) return false;
    const isErr = r.mobileStatus === 'ERROR' || r.desktopStatus === 'ERROR';
    const isAlert = r.mobileStatus === 'ALERT' || r.desktopStatus === 'ALERT';
    if (sf === 'alert' && !isAlert) return false;
    if (sf === 'ok' && (isAlert || isErr)) return false;
    if (sf === 'error' && !isErr) return false;
    return true;
  });
  render();
}
function render() {
  const sorted = [...filtered].sort((a, b) => {
    if (sortKey === 'url') return sortDir * a.url.localeCompare(b.url);
    let av, bv;
    if (sortKey === 'mobile')       { av = typeof a.mobile === 'number' ? a.mobile : 999; bv = typeof b.mobile === 'number' ? b.mobile : 999; }
    else if (sortKey === 'desktop') { av = typeof a.desktop === 'number' ? a.desktop : 999; bv = typeof b.desktop === 'number' ? b.desktop : 999; }
    else                            { av = worst(a); bv = worst(b); }
    return sortDir * (av - bv);
  });

  const body = document.getElementById('table-body');
  if (!sorted.length) { body.innerHTML = '<tr><td colspan="5" class="empty">No sites match that filter.</td></tr>'; return; }

  body.innerHTML = sorted.map(r => {
    const host = (() => { try { return new URL(r.url).hostname.replace('www.', ''); } catch { return r.url; } })();
    const name = r.label
      ? `<span class="site-label">${esc(r.label)}</span> <span class="site-host">${esc(host)}</span>`
      : `<span class="site-host">${esc(host)}</span>`;
    const cell = (v, err) => typeof v === 'number'
      ? `<span class="score ${scoreClass(v)}">${v}</span>`
      : `<span class="site-host" title="${esc(err || '')}">—</span>`;
    return `<tr>
      <td title="${esc(r.url)}">${name}</td>
      <td>${cell(r.mobile, r.mobileError)}</td>
      <td>${cell(r.desktop, r.desktopError)}</td>
      <td>${badge(r)}</td>
      <td class="cell-date">${fmtDate(r.lastChecked)}</td>
    </tr>`;
  }).join('');

  const nums = ALL.filter(r => typeof r.mobile === 'number' && typeof r.desktop === 'number');
  const alerts = ALL.filter(r => r.mobileStatus === 'ALERT' || r.desktopStatus === 'ALERT').length;
  document.getElementById('stat-total').textContent = ALL.length;
  document.getElementById('stat-alerts').textContent = alerts;
  document.getElementById('stat-mobile').textContent = nums.length ? Math.round(nums.reduce((s, r) => s + r.mobile, 0) / nums.length) : '—';
  document.getElementById('stat-desktop').textContent = nums.length ? Math.round(nums.reduce((s, r) => s + r.desktop, 0) / nums.length) : '—';
  document.getElementById('last-refreshed').textContent =
    'Showing ' + filtered.length + ' of ' + ALL.length + ' · updated ' +
    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('spin-icon');
  btn.disabled = true; icon.classList.add('spin');
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error('The API returned ' + res.status);
    const payload = await res.json();
    THRESHOLD = payload.threshold ?? 70;
    ALL = payload.sites; filtered = [...ALL];
    applyFilters();
    const hist = await fetch('/api/history');
    renderChart(hist.ok ? await hist.json() : []);
  } catch (e) {
    document.getElementById('table-body').innerHTML =
      '<tr><td colspan="5" class="empty">Could not load data. ' + esc(e.message) + '</td></tr>';
    document.getElementById('last-refreshed').textContent = 'Not loaded';
  } finally {
    btn.disabled = false; icon.classList.remove('spin');
  }
}

loadAll();
</script>
</body>
</html>
